          for path in html_files:
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')

          # A few presentation strings are assembled dynamically in Python.
          py_replacements = {
              Path('pages/dialog_page.py'): [
                  ('⚠ Sumber Revised · ', '⚠ Sumber Direvisi · '),
                  ('Rekam ulang lalu update checkbox untuk menerima source terbaru.',
                   'Rekam ulang lalu perbarui checkbox untuk menerima sumber terbaru.'),
                  ('Recording history tetap dipertahankan.', 'Riwayat rekaman tetap dipertahankan.'),
              ],
          }
          for path, pairs in py_replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Compile Python
        run: python -m compileall -q pages
      - name: Remove temporary workflow
        run: rm -f .github/workflows/ui-language-help-polish-temp.yml
      - name: Commit Help polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish Indonesian Help terminology"
          git push origin HEAD:phase10-ui-language-audit
