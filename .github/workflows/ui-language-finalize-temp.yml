              ("assert 'menu.addAction(\"Add Character…\")' in source", 'assert "Tambah Tokoh" in source'),
              ("assert 'menu.addAction(\"Add Talent…\")' in source", 'assert "Tambah Talent" in source'),
              ("assert 'menu.addAction(\"Open Source\")' in source", 'assert "Buka Sumber" in source'),
              ("assert 'menu.addAction(\"Mark as Narasi / Non-Dialog\")' in source", 'assert "Narasi / Non-Dialog" in source'),
