name: UI Language Finalize Temp

on:
  push:
    branches:
      - phase10-ui-language-audit

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase10-ui-language-audit
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Restore internal status identifiers
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('services/tracking_service.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace("DELIVERED = 'DISETOR'", 'DELIVERED = "DELIVERED"')
          text = text.replace('DELIVERED = "DISETOR"', 'DELIVERED = "DELIVERED"')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Semantic safety audit
        run: |
          git fetch origin main
          python - <<'PY'
          from __future__ import annotations
          import ast
          import subprocess
          from pathlib import Path

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main...HEAD'], text=True
          ).splitlines()
          py_files = [Path(p) for p in changed if p.endswith('.py') and Path(p).exists()]

          def parse_worktree(path: Path) -> ast.Module:
              return ast.parse(path.read_text(encoding='utf-8'), filename=str(path))

          def parse_main(path: Path) -> ast.Module | None:
              try:
                  src = subprocess.check_output(
                      ['git', 'show', f'origin/main:{path.as_posix()}'], text=True
                  )
              except subprocess.CalledProcessError:
                  return None
              return ast.parse(src, filename=f'main:{path}')

          def simple_constants(tree: ast.Module) -> dict[str, object]:
              result = {}
              for node in tree.body:
                  if not isinstance(node, (ast.Assign, ast.AnnAssign)):
                      continue
                  targets = node.targets if isinstance(node, ast.Assign) else [node.target]
                  value_node = node.value
                  if value_node is None:
                      continue
                  try:
                      value = ast.literal_eval(value_node)
                  except Exception:
                      continue
                  for target in targets:
                      if isinstance(target, ast.Name) and target.id.isupper() and not isinstance(value, (dict, list, set, tuple)):
                          result[target.id] = value
              return result

          def definitions(tree: ast.Module) -> list[tuple[str, str]]:
              rows = []
              for node in ast.walk(tree):
                  if isinstance(node, ast.FunctionDef):
                      rows.append(('function', node.name))
                  elif isinstance(node, ast.AsyncFunctionDef):
                      rows.append(('async_function', node.name))
                  elif isinstance(node, ast.ClassDef):
                      rows.append(('class', node.name))
              return sorted(rows)

          def object_names(tree: ast.Module) -> list[str]:
              rows = []
              for node in ast.walk(tree):
                  if not isinstance(node, ast.Call) or not node.args:
                      continue
                  func = node.func
                  if isinstance(func, ast.Attribute) and func.attr == 'setObjectName':
                      arg = node.args[0]
                      if isinstance(arg, ast.Constant) and isinstance(arg.value, str):
                          rows.append(arg.value)
              return rows

          failures = []
          for path in py_files:
              current = parse_worktree(path)
              baseline = parse_main(path)
              if baseline is None:
                  continue

              base_constants = simple_constants(baseline)
              now_constants = simple_constants(current)
              for name, old in base_constants.items():
                  if name in now_constants and now_constants[name] != old:
                      failures.append(
                          f'{path}: internal constant {name} changed {old!r} -> {now_constants[name]!r}'
                      )

              if definitions(current) != definitions(baseline):
                  failures.append(f'{path}: Python function/class definitions changed during language-only audit')

              if object_names(current) != object_names(baseline):
                  failures.append(f'{path}: Qt objectName literals changed during language-only audit')

          if failures:
              print('\n'.join(failures))
              raise SystemExit(1)
          print(f'Semantic safety audit passed for {len(py_files)} changed Python files.')
          PY

      - name: Compile Python
        run: python -m compileall -q app pages dialogs widgets services

      - name: Remove temporary audit workflows
        run: |
          rm -f \
            .github/workflows/ui-language-audit-temp.yml \
            .github/workflows/ui-language-normalize-safe-temp.yml \
            .github/workflows/ui-language-polish-temp.yml \
            .github/workflows/ui-language-finalize-temp.yml

      - name: Commit finalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No finalization changes"
          else
            git commit -m "Finalize UI language audit semantic safety"
            git push origin HEAD:phase10-ui-language-audit
          fi
