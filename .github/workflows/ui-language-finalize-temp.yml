          # -----------------------------------------------------------------
          # Tests: preserve behavioral assertions but make visible-copy checks
          # match the finalized Indonesian UI instead of old English wording or
          # a particular Python quote style.
          # -----------------------------------------------------------------
          patch('tests/test_alias_ui_structure.py', [
              ("assert '\"ALIAS\"' in source", 'assert "ALIAS" in source'),
