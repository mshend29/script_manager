              ('"Diagnostics, filesystem shortcuts, database safety, dan audit history."',
               '"Diagnostik, pintasan filesystem, keamanan database, dan riwayat audit."'),
              ('QTableWidgetItem("Failed")', 'QTableWidgetItem("Gagal")'),
