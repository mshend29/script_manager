              ("assert 'addItem(\"Needs Review\", \"review\")' in source", 'assert "Perlu Ditinjau" in source'),
              ("assert 'addAction(\"Mark as Narasi / Non-Dialog\")' in source", 'assert "Narasi / Non-Dialog" in source'),
              ("assert 'addAction(\"Restore to Needs Review\")' in source", 'assert "Perlu Ditinjau" in source'),
              ("assert '[\"TINGKAT\", \"KATEGORI\", \"EPS\", \"ENTITAS\", \"CODE\", \"PESAN\", \"AKSI\"]' in source", 'for header in ("TINGKAT", "KATEGORI", "EPS", "ENTITAS", "KODE", "PESAN", "AKSI"):\n        assert header in source'),
              ("assert 'addItem(\"All Severity\", None)' in source", 'assert "Semua Tingkat" in source'),
              ("assert 'addItem(\"All Categories\", None)' in source", 'assert "Semua Kategori" in source'),
              ("assert 'addItem(\"All Episodes\", None)' in source", 'assert "Semua Episode" in source'),
              ("assert 'setPlaceholderText(\"Search validation…\")' in source", 'assert "Cari validasi…" in source'),
              ("assert '(\"non_dialogue\", \"Narasi / Non-Dialog\")' in source", 'assert "Narasi / Non-Dialog" in source'),
              ("assert '(\"needs_review\", \"Needs Review\")' in source", 'assert "Perlu Ditinjau" in source'),
              ("assert '(\"system_errors\", \"System Errors\")' in source", 'assert "Error Sistem" in source'),
              ("assert '(\"workflow_warnings\", \"Workflow Warnings\")' in source", 'assert "Peringatan Alur" in source'),
              ("assert '\"✓ Project data healthy.\"' in source", 'assert "✓ Data proyek sehat." in source'),
          ])

