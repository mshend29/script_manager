              ("assert 'QPushButton(\"Add Alias Name…\")' in source", 'assert "Tambah Nama Alias…" in source'),
              ("assert 'QPushButton(\"Remove Alias / Restore\")' in source", 'assert "Hapus Alias / Pulihkan" in source'),
          ])

          patch('tests/test_data_unresolved_ui.py', [
