              ("assert 'QPushButton(\"Berikutnya ›\")' in source", 'assert "Berikutnya ›" in source'),
          ])

          patch('tests/test_help_about.py', [
              ('"Source Excel",', '"Excel sumber",'),
              ('"tidak di-embed",', '"tidak disematkan",'),
              ("assert 'HeaderAction(\"help.about\", \"Tentang Script Manager\")' in header", 'assert "help.about" in header\n    assert "Tentang Script Manager" in header'),
              ("assert 'QPushButton(\"Tentang Script Manager\")' in page", 'assert "Tentang Script Manager" in page'),
          ])

          patch('tests/test_help_getting_started.py', [
              ('"DIALOG",', '"Dialog",'),
              ('"TRACKING",', '"Tracking",'),
              ("assert 'HeaderAction(\"help.getting_started\", \"Mulai\")' in header", 'assert "help.getting_started" in header\n    assert "Mulai" in header'),
