name: UI Language Finalize Temp

on:
  push:
    branches:
      - phase10-ui-language-audit

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase10-ui-language-audit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Finalize presentation terminology and UI test contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              original = text
              for old, new in replacements:
                  text = text.replace(old, new)
              if text != original:
                  p.write_text(text, encoding='utf-8')

          # -----------------------------------------------------------------
          # Real presentation regressions / final visible-copy polish.
          # Internal IDs, statuses, SQL/schema names and objectNames remain
          # untouched.
          # -----------------------------------------------------------------
          patch('pages/project_dashboard_page.py', [
              ('QFrame#ProyekMetricCard', 'QFrame#ProjectMetricCard'),
              ('"Follow the work from recording to stem and final delivery. "\n            "Revision appears as a rework loop instead of a separate final stage."',
               '"Ikuti alur kerja dari Rekaman ke Stem hingga Setoran akhir. "\n            "Revisi tampil sebagai loop pengerjaan ulang, bukan tahap akhir terpisah."'),
              ("attention_state = \"ATTENTION\" if snapshot.actions else 'SEHAT'", 'attention_state = "ATTENTION" if snapshot.actions else "HEALTHY"'),
              ("state = 'SEHAT'\n            text = 'SEHAT'", 'state = "HEALTHY"\n            text = "SEHAT"'),
              ('Belum ada audit activity.', 'Belum ada aktivitas audit.'),
          ])

          patch('resources/help/about.html', [
              ('{{PROYEK_EXTENSION}}', '{{PROJECT_EXTENSION}}'),
              ('{{PROYEK_FORMAT_NAME}}', '{{PROJECT_FORMAT_NAME}}'),
              ('{{PROYEK_FORMAT_ID}}', '{{PROJECT_FORMAT_ID}}'),
              ('{{PROYEK_FORMAT_VERSION}}', '{{PROJECT_FORMAT_VERSION}}'),
              ('Sumber Excel, audio/output, dan setoran file tetap berupa referensi eksternal\ndan tidak di-embed ke dalam proyek.',
               'Excel sumber, audio/output, dan file Setoran tetap berupa referensi eksternal\ndan tidak disematkan ke dalam proyek.'),
          ])

          patch('pages/data_page.py', [
              ('self.unresolved_view_combo.addItem("All", "all")', 'self.unresolved_view_combo.addItem("Semua", "all")'),
              ('"Needs Review: klik CHARACTER untuk Add Character, TALENT untuk Add Talent, "\n            "ISSUE untuk Mark as Narration, atau SOURCE untuk membuka source."',
               '"Perlu Ditinjau: klik TOKOH untuk menambah tokoh, TALENT untuk menambah talent, "\n            "MASALAH untuk menandai Narasi / Non-Dialog, atau SUMBER untuk membuka file sumber."'),
              ('self.validation_system_label = QLabel("System 0")', 'self.validation_system_label = QLabel("Sistem 0")'),
              ('self.validation_review_label = QLabel("Review 0")', 'self.validation_review_label = QLabel("Peninjauan 0")'),
              ('self.validation_workflow_label = QLabel("Workflow 0")', 'self.validation_workflow_label = QLabel("Alur 0")'),
              ('self.validation_summary = QLabel("Validation belum dijalankan.")', 'self.validation_summary = QLabel("Validasi belum dijalankan.")'),
              ('self.validation_summary.setText("Validation belum dijalankan.")', 'self.validation_summary.setText("Validasi belum dijalankan.")'),
              ('self.validation_system_label.setText("System 0")', 'self.validation_system_label.setText("Sistem 0")'),
              ('self.validation_review_label.setText("Review 0")', 'self.validation_review_label.setText("Peninjauan 0")'),
              ('self.validation_workflow_label.setText("Workflow 0")', 'self.validation_workflow_label.setText("Alur 0")'),
              ('f"✕ {summary.system_errors} system error. Buka Validation."', 'f"✕ {summary.system_errors} error sistem. Buka Validasi."'),
              ('"Manual lock menjadi mapping authoritative untuk cast aktif. "\n            "Unlock hanya melepas kunci; re-resolve berikutnya terjadi saat Muat Ulang Data."',
