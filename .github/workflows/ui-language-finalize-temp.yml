          patch('app/main_window.py', [
              ('self.statusBar().showMessage("Ready")', 'self.statusBar().showMessage("Siap")'),
              ('self.statusBar().showMessage(f"{page_name.title()} page")', 'self.statusBar().showMessage(f"Workspace {page_name.title()}")'),
              ('f"Gagal menyimpan settings.\\n\\n{exc}"', 'f"Gagal menyimpan pengaturan.\\n\\n{exc}"'),
              ('f"Duplicate gagal.\\n\\n{exc}"', 'f"Duplikat gagal.\\n\\n{exc}"'),
              ('f"Duplicate opened: {duplicated.project_file}"', 'f"Duplikat dibuka: {duplicated.project_file}"'),
              ('f"Recovery gagal.\\n\\n{exc}"', 'f"Pemulihan gagal.\\n\\n{exc}"'),
              ('"Project berhasil direcover.\\n\\n"', '"Proyek berhasil dipulihkan.\\n\\n"'),
              ('f"Proyek ditutup, tetapi terjadi error saat save:\\n{exc}"', 'f"Proyek ditutup, tetapi terjadi error saat menyimpan:\\n{exc}"'),
