name: UI Language Audit Temp

on:
  push:
    branches:
      - phase10-ui-language-audit

permissions:
  contents: read

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Find residual user-facing English terminology
        run: |
          python - <<'PY'
          from __future__ import annotations
          import ast
          import re
          from pathlib import Path

          roots = [Path('app'), Path('pages'), Path('dialogs'), Path('widgets'), Path('services')]
          suspect = re.compile(
              r'\b(Character|Characters|Project|Source|Sources|Delivery|Revision|Recording|'
              r'Open|Close|New|Save|Refresh|Search|Copy|Help|Tools|Getting|Guide|Shortcut|'
              r'Output Health|Track Files|Needs Review|Unresolved|Warning|Warnings|Settings|'
              r'Select|Browse|Current|Expected|Apply|Restore|Backup|Check for|About)\b',
              re.IGNORECASE,
          )
          for root in roots:
              for path in sorted(root.rglob('*.py')):
                  try:
                      tree = ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
                  except Exception:
                      continue
                  hits = []
                  for node in ast.walk(tree):
                      if not isinstance(node, ast.Constant) or not isinstance(node.value, str):
                          continue
                      text = node.value.strip().replace('\n', r'\n')
                      if not text or len(text) > 500 or not suspect.search(text):
                          continue
                      # Suppress obvious internal-only tokens/IDs/constants.
                      if re.fullmatch(r'[A-Z0-9_./:-]+', text):
                          continue
                      if re.fullmatch(r'[a-z0-9_.:-]+', text):
                          continue
                      hits.append((getattr(node, 'lineno', 0), text))
                  if hits:
                      print(f'### {path}')
                      for lineno, text in sorted(hits):
                          print(f'{lineno}: {text}')
          PY
