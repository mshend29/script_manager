name: Windows Package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "main.py"
      - "app/**"
      - "core/**"
      - "dialogs/**"
      - "import_engine/**"
      - "pages/**"
      - "services/**"
      - "widgets/**"
      - "resources/**"
      - "requirements.txt"
      - "requirements-build.txt"
      - "packaging/**"
      - ".github/workflows/windows-package.yml"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Build Windows application
        run: |
          python -m PyInstaller --clean --noconfirm packaging/ScriptManager.spec

      - name: Smoke test frozen executable
        shell: pwsh
        run: |
          & ".\dist\ScriptManager\ScriptManager.exe" --smoke-test
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $version = python -c "from core.version import APP_VERSION; print(APP_VERSION)"
          $zip = "ScriptManager-$version-windows-x64.zip"
          Compress-Archive -Path ".\dist\ScriptManager\*" -DestinationPath $zip
          "PACKAGE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ScriptManager-windows
          path: ${{ env.PACKAGE_ZIP }}
          if-no-files-found: error
