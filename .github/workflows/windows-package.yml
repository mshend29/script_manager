name: Windows Package

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/windows-package.yml"
      - "requirements.txt"
      - "requirements-build.txt"
      - "requirements-release.txt"
      - "core/version.py"
      - "core/icon_assets.py"
      - "core/resource_paths.py"
      - "core/runtime_diagnostics.py"
      - "core/application_logging.py"
      - "resources/**"
      - "main.py"
      - "app/google_drive_readiness_controller.py"
      - "dialogs/google_drive_readiness_dialog.py"
      - "services/windows_prerequisite_service.py"
      - "services/problem_report_service.py"
      - "services/application_info_service.py"
      - "tests/test_phase12_google_drive_readiness.py"
      - "tests/test_phase12_qt_google_drive_readiness.py"
      - "tests/test_phase12_packaged_runtime_diagnostics.py"
      - "tests/test_phase12_windows_identity.py"
      - "tests/test_phase12_windows_file_association.py"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-release.txt

      - name: Smoke test Google Drive readiness probes
        shell: pwsh
        run: |
          python -c "from services.windows_prerequisite_service import GoogleDriveReadinessService, _find_google_drive_roots, _is_google_drive_process_running; print('roots=', _find_google_drive_roots()); print('running=', _is_google_drive_process_running()); print('state=', GoogleDriveReadinessService().check().state.value)"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build Windows application
        run: |
          python -m PyInstaller --clean --noconfirm packaging/ScriptManager.spec

      - name: Verify Windows application identity
        shell: pwsh
        run: |
          $version = python -c "from core.version import APP_VERSION; print(APP_VERSION)"
          $exe = Get-Item ".\dist\ScriptManager\ScriptManager.exe"
          $info = $exe.VersionInfo

          if ($info.ProductName -ne "Script Manager") {
            throw "Unexpected ProductName: $($info.ProductName)"
          }
          if ($info.FileDescription -ne "Script Manager") {
            throw "Unexpected FileDescription: $($info.FileDescription)"
          }
          if ($info.CompanyName -ne "Script Manager") {
            throw "Unexpected CompanyName: $($info.CompanyName)"
          }
          if ($info.OriginalFilename -ne "ScriptManager.exe") {
            throw "Unexpected OriginalFilename: $($info.OriginalFilename)"
          }
          if ($info.ProductVersion -notlike "$version*") {
            throw "Unexpected ProductVersion: $($info.ProductVersion)"
          }
          if ($info.FileVersion -notlike "$version*") {
            throw "Unexpected FileVersion: $($info.FileVersion)"
          }

      - name: Create smproj path smoke fixture
        shell: pwsh
        run: |
          $fixtureRoot = Join-Path $env:TEMP "Script Manager Association – Uji"
          New-Item -ItemType Directory -Force -Path $fixtureRoot | Out-Null
          $env:ASSOC_FIXTURE_ROOT = $fixtureRoot
          python -c "import os; from core.project_manager import ProjectManager; from core.project_settings import ProjectSettings; ProjectManager().create(ProjectSettings(project_name='Association Smoke Project', project_code='ASSOC'), os.environ['ASSOC_FIXTURE_ROOT'])"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $project = Get-ChildItem -LiteralPath $fixtureRoot -Filter "*.smproj" | Select-Object -First 1
          if (-not $project) {
            throw "Association smoke .smproj was not created under: $fixtureRoot"
          }
          $projectPath = $project.FullName
          "ASSOC_SMOKE_PROJECT=$projectPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Smoke test frozen executable
        shell: pwsh
        run: |
          & ".\dist\ScriptManager\ScriptManager.exe" --smoke-test
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          & ".\dist\ScriptManager\ScriptManager.exe" --diagnostics-smoke-test
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          & ".\dist\ScriptManager\ScriptManager.exe" "$env:ASSOC_SMOKE_PROJECT" --smoke-test
          if ($LASTEXITCODE -ne 0) {
            throw "Frozen .smproj path-open smoke failed with exit code $LASTEXITCODE"
          }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $version = python -c "from core.version import APP_VERSION; print(APP_VERSION)"
          $zip = "ScriptManager-$version-windows-x64.zip"
          Compress-Archive -Path ".\dist\ScriptManager\*" -DestinationPath $zip
          "PACKAGE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ScriptManager-windows
          path: ${{ env.PACKAGE_ZIP }}
          if-no-files-found: error

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 -y --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = python -c "from core.version import APP_VERSION; print(APP_VERSION)"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$version" "packaging\ScriptManager.iss"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $installer = Get-ChildItem ".\installer-dist\ScriptManager-*-Setup.exe" | Select-Object -First 1
          if (-not $installer) {
            throw "Installer output was not created."
          }
          "INSTALLER_EXE=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify Windows installer identity
        shell: pwsh
        run: |
          $version = python -c "from core.version import APP_VERSION; print(APP_VERSION)"
          $info = (Get-Item $env:INSTALLER_EXE).VersionInfo

          if ($info.ProductName -ne "Script Manager") {
            throw "Unexpected installer ProductName: $($info.ProductName)"
          }
          if ($info.FileDescription -ne "Script Manager Setup") {
            throw "Unexpected installer FileDescription: $($info.FileDescription)"
          }
          if ($info.CompanyName -ne "Script Manager") {
            throw "Unexpected installer CompanyName: $($info.CompanyName)"
          }
          if ($info.ProductVersion -notlike "$version*") {
            throw "Unexpected installer ProductVersion: $($info.ProductVersion)"
          }
          if ($info.FileVersion -notlike "$version*") {
            throw "Unexpected installer FileVersion: $($info.FileVersion)"
          }

      - name: Silent install and association smoke test
        shell: pwsh
        run: |
          $installDir = Join-Path $env:TEMP "ScriptManager-Install-Test"
          $process = Start-Process -FilePath $env:INSTALLER_EXE -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/SKIPDRIVEPREREQ=1",
            "/DIR=$installDir"
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            exit $process.ExitCode
          }

          $installedExe = Join-Path $installDir "ScriptManager.exe"
          & $installedExe --smoke-test
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          & $installedExe --diagnostics-smoke-test
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          & $installedExe "$env:ASSOC_SMOKE_PROJECT" --smoke-test
          if ($LASTEXITCODE -ne 0) {
            throw "Installed .smproj path-open smoke failed with exit code $LASTEXITCODE"
          }

          $extensionKey = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey(
            "Software\Classes\.smproj"
          )
          if (-not $extensionKey) {
            throw ".smproj association was not registered."
          }
          $progId = [string]$extensionKey.GetValue("")
          $extensionKey.Close()
          if ($progId -ne "ScriptManager.Project") {
            throw "Unexpected .smproj ProgID: $progId"
          }

          $projectKey = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey(
            "Software\Classes\ScriptManager.Project"
          )
          if (-not $projectKey) {
            throw "ScriptManager.Project registration is missing."
          }
          $projectTypeName = [string]$projectKey.GetValue("")
          $projectKey.Close()
          if ($projectTypeName -ne "Script Manager Project") {
            throw "Unexpected .smproj type name: $projectTypeName"
          }

          $iconKey = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey(
            "Software\Classes\ScriptManager.Project\DefaultIcon"
          )
          if (-not $iconKey) {
            throw "ScriptManager.Project icon was not registered."
          }
          $projectIcon = [string]$iconKey.GetValue("")
          $iconKey.Close()
          if ($projectIcon -notlike '*resources\project_file.ico') {
            throw "Unexpected .smproj icon: $projectIcon"
          }
          if (-not (Test-Path (Join-Path $installDir "resources\project_file.ico"))) {
            throw "Installed project_file.ico is missing."
          }

          $commandKey = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey(
            "Software\Classes\ScriptManager.Project\shell\open\command"
          )
          if (-not $commandKey) {
            throw "ScriptManager.Project open command was not registered."
          }
          $openCommand = [string]$commandKey.GetValue("")
          $commandKey.Close()
          if ($openCommand -notlike '*ScriptManager.exe*"%1"*') {
            throw "Unexpected .smproj open command: $openCommand"
          }

          $uninstaller = Join-Path $installDir "unins000.exe"
          if (Test-Path $uninstaller) {
            $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @(
              "/VERYSILENT",
              "/SUPPRESSMSGBOXES",
              "/NORESTART"
            ) -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) {
              exit $uninstall.ExitCode
            }
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ScriptManager-windows-installer
          path: installer-dist/ScriptManager-*-Setup.exe
          if-no-files-found: error
