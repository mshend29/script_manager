            'tersimpan sementara recording belum lengkap.':'tersimpan sementara rekaman belum lengkap.',
          }

          fparts = {
            'Proyek created:':'Proyek dibuat:','Proyek opened:':'Proyek dibuka:','Proyek saved as:':'Proyek disimpan sebagai:',
            'Project created:':'Proyek dibuat:','Project opened:':'Proyek dibuka:','Project saved as:':'Proyek disimpan sebagai:',
            ': sumber tidak berubah; Track Files diperbarui':': sumber tidak berubah; File Track diperbarui',
            'Backup schema v':'Skema cadangan v','Valid Script Manager backup (schema v':'Cadangan Script Manager valid (skema v',
            'Stem / Export file renamed to expected filename for':'File Stem / Export diubah ke nama yang diharapkan untuk',
          }

          fm=getattr(tokenize,'FSTRING_MIDDLE',-999)
          for root in roots:
            for p in root.rglob('*.py'):
              src=p.read_text(encoding='utf-8'); out=[]
              try: toks=list(tokenize.generate_tokens(io.StringIO(src).readline))
              except tokenize.TokenError: continue
              for tok in toks:
                if tok.type == tokenize.STRING:
                  try: val=ast.literal_eval(tok.string)
                  except Exception: val=None
                  if isinstance(val,str) and val in exact:
                    tok=tokenize.TokenInfo(tok.type,repr(exact[val]),tok.start,tok.end,tok.line)
                elif tok.type == fm:
                  text=tok.string
                  for old,new in sorted(fparts.items(),key=lambda x:-len(x[0])): text=text.replace(old,new)
                  tok=tokenize.TokenInfo(tok.type,text,tok.start,tok.end,tok.line)
                out.append(tok)
              new=tokenize.untokenize(out)
              if new != src: p.write_text(new,encoding='utf-8')
          PY
      - name: Compile
        run: python -m compileall -q app pages dialogs widgets services
      - name: Commit polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app pages dialogs widgets services
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Polish remaining Indonesian UI messages"
          git push origin HEAD:phase10-ui-language-audit
