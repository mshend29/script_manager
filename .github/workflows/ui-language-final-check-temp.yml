name: UI Language Final Check Temp

on:
  push:
    branches:
      - phase10-ui-language-audit

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase10-ui-language-audit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Align remaining UI tests and visible copy
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              old_text = text
              for old, new in replacements:
                  text = text.replace(old, new)
              if text != old_text:
                  p.write_text(text, encoding='utf-8')

          # A couple of visible strings discovered by the final audit.
          patch('pages/tracking_compact_page.py', [
              ('"otomatis. Klik dua kali untuk memilih expected "\n                        "filename secara manual."',
               '"otomatis. Klik dua kali untuk memilih nama file "\n                        "yang diharapkan secara manual."'),
              ('"Tidak ada file yang cocok pada scope ini."', '"Tidak ada file yang cocok pada lingkup ini."'),
          ])
          patch('app/main_window.py', [
              ('"Source Folder belum diisi.\\n\\n"\n                    "Isi melalui PROJECT → Project Settings."',
               '"Folder Sumber belum diisi.\\n\\n"\n                    "Isi melalui Proyek → Pengaturan Proyek."'),
              ('"preparing preview"\n            if operation == "prepare"\n            else "applying changes"',
               '"menyiapkan pratinjau"\n            if operation == "prepare"\n            else "menerapkan perubahan"'),
              ('f"{title} preview selesai, tetapi proyek sudah tidak tersedia"', 'f"{title}: pratinjau selesai, tetapi proyek sudah tidak tersedia"'),
              ('f"{title} preview selesai dengan masalah"', 'f"{title}: pratinjau selesai dengan masalah"'),
              ('"DUPLICATE EPISODE:\\n"', '"EPISODE DUPLIKAT:\\n"'),
              ('f"{page_name.title()} view refreshed"', 'f"Workspace {page_name.title()} dimuat ulang"'),
          ])

          # Service read models intentionally expose localized sentinel labels;
          # behavioral tests should assert those user-facing values.
          patch('tests/test_data_integrity_hardening.py', [
              ('assert unresolved[0].character_name == "⚠ Missing Character"', 'assert unresolved[0].character_name == "⚠ Tokoh Tidak Dikenal"'),
              ('assert unresolved[0].talent_name == "⚠ Missing Talent"', 'assert unresolved[0].talent_name == "⚠ Talent Tidak Dikenal"'),
          ])
          patch('tests/test_data_unresolved_manual_resolution.py', [
              ('assert rows[0].character_name == "⚠ Missing Character"', 'assert rows[0].character_name == "⚠ Tokoh Tidak Dikenal"'),
              ('assert rows[0].talent_name == "⚠ Missing Talent"', 'assert rows[0].talent_name == "⚠ Talent Tidak Dikenal"'),
          ])
          patch('tests/test_help_user_guide.py', [
              ('"Alias Tokoh",', '"Tokoh Alias",'),
          ])
          patch('tests/test_project_dashboard_work_queue.py', [
              ('assert \'page.show_section("Unresolved")\' in main', 'assert "page.show_section(\'Belum Dipetakan\')" in main'),
          ])
          patch('tests/test_project_home_startup.py', [
              ('assert \'QLabel("Recent Projects")\' in source', 'assert "Proyek Terbaru" in source'),
          ])
          patch('tests/test_project_lifecycle.py', [
              ('assert \'"Recent Projects"\' in home', 'assert "Proyek Terbaru" in home'),
          ])
          patch('tests/test_sync_source_ux.py', [
              ('assert "sinkronisasi lanjutan" in getting_started', 'assert "Sinkronisasi berikutnya" in getting_started'),
          ])
          patch('tests/test_tools_maintenance.py', [
              ('assert \'"FOLDERS & DRIVE LINKS"\' in page', 'assert "FOLDER & TAUTAN DRIVE" in page'),
          ])
          patch('tests/test_track_file_settings_ui.py', [
              ('assert "Stem / Mixdown / Export Folder" in source', 'assert "Stem / Mixdown / Export" in source'),
              ('assert "Episode Preview:" in source', 'assert "Pratinjau Episode:" in source'),
          ])
          patch('tests/test_tracking_compact_grid_ui.py', [
              ('assert \'QLabel("TRACK FILES")\' in compact', 'assert "FILE TRACK" in compact'),
              ('assert "Aliases:" in compact', 'assert "Alias:" in compact'),
              ('assert \'QLabel("WARNINGS")\' in compact', 'assert "PERINGATAN" in compact'),
              ('assert \'"Match / Rename Stem / Export…"\' in compact', 'assert "Cocokkan / Ubah Nama Stem / Export…" in compact'),
              ('assert "File Unmatched atau Ambiguous" in dialog', 'assert "File Tidak Cocok atau Ambigu" in dialog'),
          ])
          patch('tests/test_qt_runtime_smoke.py', [
              ('assert tracking_page.detail_revision_button.text() == "Clear Revision"', 'assert tracking_page.detail_revision_button.text() == "Batalkan Revisi"'),
          ])
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app pages tests
          if ! git diff --cached --quiet; then
            git commit -m "Complete UI language CI alignment"
            git push origin HEAD:phase10-ui-language-audit
          fi
