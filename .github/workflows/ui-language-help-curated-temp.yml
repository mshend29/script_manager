name: UI Language Help Curated Temp

on:
  push:
    branches:
      - phase10-ui-language-audit

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase10-ui-language-audit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Rewrite Help bodies with curated Indonesian copy
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          bodies = {
              'getting_started.html': '''<body>
<h1>Mulai</h1>
<p>Panduan singkat untuk memulai proyek manajemen naskah drama pendek vertikal di Script Manager.</p>

<h2>1. Buat Proyek</h2>
<ol>
  <li>Buka workspace <b>Proyek</b>.</li>
  <li>Pilih <b>Proyek Baru</b>.</li>
  <li>Isi Nama Proyek, Kode Proyek, Klien, Tanggal Mulai, dan lokasi penyimpanan.</li>
  <li>Jika sudah tersedia, tentukan <b>Folder Naskah Sumber</b> dan pemisah nomor episode.</li>
  <li>Klik <b>Buat Proyek</b>.</li>
</ol>
<div class="note">
Proyek disimpan sebagai satu file <code>.smproj</code>. File ini menyimpan database kerja, pemetaan, status rekaman, tracking, pengaturan, dan metadata proyek.
</div>

<h2>2. Siapkan Excel Sumber</h2>
<p>File Excel tetap berada di folder eksternal. Script Manager tidak memasukkan file Excel ke dalam <code>.smproj</code>.</p>
<ul>
  <li>Atur <b>Folder Naskah Sumber</b> melalui <b>Pengaturan Proyek</b>.</li>
  <li>Pastikan pola nama file episode sesuai pemisah yang ditentukan.</li>
  <li>File sumber dapat berupa <code>.xlsx</code> atau <code>.xlsm</code> sesuai dukungan impor.</li>
</ul>

<h2>3. Sinkronkan Sumber</h2>
<ol>
  <li>Pada workspace <b>Proyek</b>, pilih <b>Sinkronkan Sumber</b>.</li>
  <li>Script Manager memindai file, memeriksa workbook, mem-parse naskah, menormalisasi data, menyelesaikan tokoh/talent, lalu menjalankan validasi.</li>
  <li>Periksa pratinjau perubahan.</li>
  <li>Terapkan pembaruan jika hasilnya sesuai.</li>
</ol>
<p>Sinkronisasi pertama mengisi proyek dari sumber. Sinkronisasi berikutnya hanya memproses perubahan yang relevan.</p>

<h2>4. Saat Klien Merevisi Naskah</h2>
<p>Perbarui file Excel di <b>Folder Naskah Sumber</b>, lalu jalankan <b>Sinkronkan Sumber</b> lagi. Riwayat rekaman dan pemetaan manual dipertahankan. Tracking lanjutan hanya direset pada lingkup Episode + Talent + Tokoh yang benar-benar terdampak.</p>

<h2>5. Rekaman Dialog</h2>
<p>Buka workspace <b>Dialog</b>. Gunakan checkbox untuk menandai dialog yang sudah direkam. Jika sumber berubah setelah rekaman, dialog diberi indikator <b>Sumber Direvisi</b> sampai operator menerima hasil rekaman ulang.</p>

<h2>6. Tracking dan Setoran</h2>
<p><b>Tracking</b> merangkum progres per talent, tokoh, dan episode. Status lanjutan seperti Stem, Setoran, dan Revisi mengikuti alur produksi.</p>

<h2>7. Simpan dan Pemulihan</h2>
<ul>
  <li><b>Simpan</b> menyimpan proyek aktif.</li>
  <li><b>Simpan Sebagai</b> membuat file baru dengan identitas proyek yang sama.</li>
  <li><b>Duplikat</b> membuat proyek baru dengan data awal yang sama dan identitas baru.</li>
  <li><b>Pulihkan Proyek</b> membuat file proyek baru dari cadangan yang tersedia.</li>
</ul>

<div class="note">
Gunakan <b>Panduan Pengguna</b> untuk penjelasan lengkap, <b>Pintasan Keyboard</b> untuk navigasi cepat, dan <b>Laporkan Masalah</b> untuk menyiapkan laporan teknis.
</div>
</body>''',
              'keyboard_shortcuts.html': '''<body>
<h1>Pintasan Keyboard</h1>
<p>Pintasan berikut aktif secara global pada jendela utama Script Manager.</p>

<h2>Proyek</h2>
