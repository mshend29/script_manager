  <li>Tambahkan tangkapan layar hanya jika aman untuk dibagikan.</li>
  <li>Periksa kembali isi laporan sebelum mengirim.</li>
</ol>

<div class="note">Jika browser tidak dapat dibuka, gunakan <b>Salin Template Laporan</b>, lalu tempel template tersebut secara manual ke GitHub Issues.</div>
