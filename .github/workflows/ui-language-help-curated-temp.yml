              'user_guide.html': '''<body>
<h1>Panduan Pengguna</h1>
<p>Panduan operasional Script Manager untuk manajemen naskah drama pendek vertikal, rekaman dialog, pemetaan tokoh/talent, Tracking, Stem, dan Setoran.</p>

<div class="toc">
<b>Isi panduan</b>
<ol>
<li>Proyek <code>.smproj</code></li><li>Proyek dan Pengaturan Proyek</li><li>Excel sumber dan Sinkronkan Sumber</li><li>Naskah</li><li>Dialog dan Rekaman</li><li>Tracking dan Setoran</li><li>Data dan Validasi</li><li>Peralatan &amp; Pemeliharaan</li><li>Cadangan dan Pemulihan</li>
</ol>
</div>

<h2>1. Proyek .smproj</h2>
<p>Setiap proyek Script Manager disimpan sebagai satu file <code>.smproj</code>. File ini menyimpan database kerja, pengaturan proyek, metadata sumber, episode, dialog, tokoh, talent, pemetaan, status rekaman, status Tracking, validasi, dan riwayat audit.</p>
<p>Excel sumber, folder Stem/Export, Folder Setoran, serta tautan Drive tetap berada di luar file proyek.</p>

<h2>2. Proyek dan Pengaturan Proyek</h2>
<p>Workspace <b>Proyek</b> adalah titik awal untuk membuat, membuka, menyimpan, dan memantau pekerjaan.</p>
<table>
<tr><th>Pengaturan</th><th>Fungsi</th></tr>
<tr><td>Nama Proyek</td><td>Nama proyek yang tampil di aplikasi.</td></tr>
<tr><td>Kode Proyek</td><td>Kode identitas kerja proyek.</td></tr>
<tr><td>Klien</td><td>Nama klien atau pemilik proyek.</td></tr>
<tr><td>Tanggal Mulai</td><td>Tanggal mulai proyek.</td></tr>
<tr><td>Folder Naskah Sumber</td><td>Folder tempat Excel naskah berada.</td></tr>
<tr><td>Drive Utama</td><td>Tautan navigasi ke drive utama proyek.</td></tr>
</table>
<p>Gunakan <b>Baca Nama File Sumber</b> untuk memeriksa pola episode, lalu atur <b>Sebelum Nomor Episode</b> dan <b>Setelah Nomor Episode</b> bila diperlukan.</p>

<h2>3. Excel Sumber dan Sinkronkan Sumber</h2>
<p><b>Sinkronkan Sumber</b> digunakan untuk impor awal maupun pembaruan berikutnya. Sistem memindai file, memeriksa workbook, mem-parse naskah, menyelesaikan tokoh/talent, menjalankan validasi, menampilkan pratinjau, membuat cadangan keselamatan, lalu menerapkan perubahan secara transaksional.</p>
<div class="warning">Jika ditemukan masalah yang membuat sinkronisasi tidak aman, commit dihentikan agar database tidak berubah sebagian.</div>
<div class="note">Jika sumber berubah setelah dialog direkam, workspace Dialog menampilkan indikator <b>Sumber Direvisi</b>. Riwayat rekaman dan pemetaan manual tetap dipertahankan.</div>

<h2>4. Naskah</h2>
<p>Workspace <b>Naskah</b> digunakan untuk membaca hasil naskah yang sudah masuk ke database proyek. Gunakan filter Episode dan pencarian untuk menemukan dialog.</p>

<h2>5. Dialog dan Rekaman</h2>
<p>Workspace <b>Dialog</b> digunakan untuk memilih Talent, Tokoh, dan Episode lalu menandai progres rekaman.</p>
<ul>
<li><b>Sebelumnya / Berikutnya</b> untuk berpindah episode.</li>
<li><b>Buka File Sumber</b> untuk membuka Excel sumber episode.</li>
<li><b>Centang Semua</b> dan <b>Hapus Centang Semua</b> untuk mengubah status rekaman pada lingkup aktif.</li>
<li><b>Salin Semua Dialog</b> untuk menyalin dialog yang sedang tampil.</li>
</ul>

<h2>6. Tracking dan Setoran</h2>
<p><b>Tracking</b> merangkum status per talent, tokoh, dan episode. Track yang sudah Terekam atau Revisi masuk antrean Stem; track yang sudah Selesai Stem berpindah ke proses Setoran.</p>
<p>Tindakan manual downstream hanya <b>Tandai Revisi</b> dan <b>Batalkan Revisi</b>; status Selesai Stem dan Disetor berasal dari inventaris file.</p>
<h3>File Track</h3>
<p>Area File Track menyediakan <b>Cocokkan &amp; Ubah Nama Episode</b>, pencocokan talent, muat ulang file, dan <b>Saran Nama Track</b>.</p>
<h3>Kondisi Output</h3>
<p>Kondisi Output merangkum file Stem/Setoran dan Peringatan yang perlu ditinjau.</p>

<h2>7. Data dan Validasi</h2>
<p>Area <b>Data</b> digunakan untuk memeriksa kondisi data, pemetaan Tokoh &amp; Talent, daftar yang belum dipetakan, sumber, serta hasil Validasi.</p>
<h3>Alias Tokoh</h3>
<p>Alias Tokoh menyatukan variasi nama sumber ke tokoh kanonis tanpa mengubah file klien. Gunakan <b>Jadikan Alias</b>, <b>Tambah Nama Alias…</b>, atau <b>Hapus Alias / Pulihkan</b>.</p>

<h2>8. Peralatan &amp; Pemeliharaan</h2>
<p>Area <b>Peralatan</b> menyediakan <b>Jalankan Diagnostik</b>, <b>Riwayat Audit</b>, akses folder kerja, tautan Drive, serta fungsi pemeliharaan.</p>

<h2>9. Cadangan dan Pemulihan</h2>
<ul>
<li><b>Buat Cadangan</b> membuat snapshot <code>.smproj</code>.</li>
<li><b>Pulihkan Cadangan</b> mengembalikan database proyek aktif dari snapshot yang valid dan membuat cadangan keselamatan terlebih dahulu.</li>
<li><b>Pulihkan Proyek</b> membuat file proyek baru dari snapshot tanpa menimpa file proyek asli.</li>
</ul>

<h2>10. Alur Kerja yang Direkomendasikan</h2>
<ol>
<li>Buat atau buka proyek.</li><li>Periksa Pengaturan Proyek.</li><li>Jalankan Sinkronkan Sumber.</li><li>Selesaikan Data yang perlu ditinjau.</li><li>Gunakan Naskah dan Dialog untuk produksi rekaman.</li><li>Pantau Tracking, Stem, dan Setoran.</li><li>Buat cadangan pada milestone penting.</li>
</ol>
</body>''',
          }

          root = Path('resources/help')
          for name, body in bodies.items():
              path = root / name
              text = path.read_text(encoding='utf-8')
              updated, count = re.subn(r'<body>.*?</body>', body, text, flags=re.S)
              if count != 1:
                  raise SystemExit(f'Could not replace one body in {name}: {count}')
              path.write_text(updated, encoding='utf-8')
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/ui-language-help-curated-temp.yml
      - name: Commit curated Help
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rewrite Help with curated Indonesian terminology"
          git push origin HEAD:phase10-ui-language-audit
