<tr><td><kbd>Ctrl+O</kbd></td><td>Buka Proyek</td><td>Membuka file Script Management Project <code>.smproj</code>.</td></tr>
<tr><td><kbd>Ctrl+S</kbd></td><td>Simpan</td><td>Menyimpan proyek aktif.</td></tr>
