          }

          # F-string literal segments only. Expressions between braces are untouched.
          F = {'Project':'Proyek','project':'proyek','Character':'Tokoh','character':'tokoh','Source':'Sumber','source':'sumber',
               'Revision':'Revisi','Stemmed':'Selesai Stem','Delivered':'Disetor','Delivery':'Setoran',
               'Current:':'Saat ini:','Expected:':'Diharapkan:','Warnings:':'Peringatan:','Copied:':'Tersalin:'}

          def transform(source):
            out=[]; fm=getattr(tokenize,'FSTRING_MIDDLE',-999)
            for tok in tokenize.generate_tokens(io.StringIO(source).readline):
              if tok.type == tokenize.STRING:
                try: value=ast.literal_eval(tok.string)
                except Exception: value=None
                if isinstance(value,str) and value in M:
                  tok=tokenize.TokenInfo(tok.type,repr(M[value]),tok.start,tok.end,tok.line)
              elif tok.type == fm:
                text=tok.string
                for old,new in sorted(F.items(),key=lambda x:-len(x[0])): text=text.replace(old,new)
                tok=tokenize.TokenInfo(tok.type,text,tok.start,tok.end,tok.line)
              out.append(tok)
            return tokenize.untokenize(out)

          for name in files:
            p=Path(name)
            if not p.exists(): continue
            before=p.read_text(encoding='utf-8'); after=transform(before)
            if after != before: p.write_text(after,encoding='utf-8')

          # Help pages contain no application identifiers. Only visible text outside tags is translated.
          H={'Keyboard Shortcuts':'Pintasan Keyboard','Getting Started':'Mulai','User Guide':'Panduan Pengguna',
             'Report a Problem':'Laporkan Masalah','About Script Manager':'Tentang Script Manager','Project':'Proyek',
