             'Add Character':'Tambah Tokoh','Add Talent':'Tambah Talent','Mark as Narration / Non-Dialogue':'Tandai sebagai Narasi / Non-Dialog',
             'Cast Mapping':'Pemetaan Tokoh & Talent','Open Project':'Buka Proyek','New Project':'Proyek Baru',
             'Close Project':'Tutup Proyek','Save As':'Simpan Sebagai','Open Source':'Buka Sumber','Search Script':'Cari Naskah',
             'Sync Source':'Sinkronkan Sumber','Open GitHub Issue':'Buka GitHub Issue','Copy Report Template':'Salin Template Laporan',
             'Open Release Page':'Buka Halaman Rilis','Action':'Aksi','Application':'Aplikasi','Version':'Versi',
             'Project Format':'Format Proyek','File extension':'Ekstensi file','Format name':'Nama format','Format version':'Versi format',
             'Database schema':'Skema database','Operating system':'Sistem operasi','Architecture':'Arsitektur',
             'Environment':'Lingkungan','Value':'Nilai','Privacy:':'Privasi:','Submit':'Kirim',
             'Expected result':'Hasil yang diharapkan','Actual result':'Hasil aktual','Steps to reproduce':'Langkah reproduksi',
             'Recording':'Rekaman','Tools':'Peralatan','Help':'Bantuan'}
          for p in [Path('resources/help/getting_started.html'),Path('resources/help/user_guide.html'),
                    Path('resources/help/keyboard_shortcuts.html'),Path('resources/help/report_problem.html'),Path('resources/help/about.html')]:
            if not p.exists(): continue
            parts=re.split(r'(<[^>]+>)',p.read_text(encoding='utf-8'))
            for i in range(0,len(parts),2):
              for old,new in sorted(H.items(),key=lambda x:-len(x[0])): parts[i]=parts[i].replace(old,new)
            p.write_text(''.join(parts),encoding='utf-8')
          PY
      - name: Compile changed Python
        run: python -m compileall -q app pages dialogs widgets services
      - name: Commit normalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app pages dialogs widgets services resources/help
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Normalize visible Indonesian UI terminology"
          git push origin HEAD:phase10-ui-language-audit
