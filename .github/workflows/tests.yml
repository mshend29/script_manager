name: Engine Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest openpyxl

      - name: Compile Python sources
        run: |
          python -m compileall -q \
            app core dialogs import_engine pages services tests widgets

      - name: Run tests
        run: python -m pytest -q


  qt-runtime:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0

      - name: Install Qt runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run Qt runtime smoke tests
        run: |
          python -m pytest -q \
            tests/test_script_page_runtime.py \
            tests/test_qt_runtime_smoke.py \
            tests/test_phase10_responsive_runtime.py \
            tests/test_phase10_operator_runtime.py
