name: UI Language Visible Polish Temp

on:
  push:
    branches:
      - phase10-ui-language-audit

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase10-ui-language-audit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Polish exact visible phrases
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'pages/project_page.py': [
                  ('QLabel("PROJECT")', 'QLabel("PROYEK")'),
                  ("QLabel('PROJECT')", "QLabel('PROYEK')"),
                  ('Open a recent project, search by project name or location, or sort the list from the column headers.',
                   'Buka proyek terbaru, cari berdasarkan nama atau lokasi proyek, atau urutkan daftar dari header kolom.'),
                  ('["PROJECT", "LAST OPENED"]', '["PROYEK", "TERAKHIR DIBUKA"]'),
              ],
              'pages/project_dashboard_page.py': [
                  ('QFrame#ProyekIdentityCard', 'QFrame#ProjectIdentityCard'),
                  ('QFrame#ProyekHealthBanner', 'QFrame#ProjectHealthBanner'),
                  ('QFrame#ProyekMetricStrip', 'QFrame#ProjectMetricStrip'),
                  ('QFrame#ProyekMetricSeparator', 'QFrame#ProjectMetricSeparator'),
                  ('QFrame#ProyekPipelineRail', 'QFrame#ProjectPipelineRail'),
                  ('QLabel#ProyekPipelineArrow', 'QLabel#ProjectPipelineArrow'),
                  ('QFrame#ProyekRevisiLoop', 'QFrame#ProjectRevisionLoop'),
                  ('QFrame#ProyekPanel', 'QFrame#ProjectPanel'),
                  ('QFrame#ProyekActivityPanel', 'QFrame#ProjectActivityPanel'),
                  ('QLabel#ProyekActivityDot', 'QLabel#ProjectActivityDot'),
                  ('Follow the work from recording to stem and final delivery. Revision appears as a rework loop instead of a separate final stage.',
                   'Ikuti pekerjaan dari rekaman ke stem hingga setoran akhir. Revisi tampil sebagai loop pengerjaan ulang, bukan tahap akhir terpisah.'),
                  ('Main drive: Configured', 'Drive utama: Dikonfigurasi'),
                  ('Main drive: Not configured', 'Drive utama: Belum dikonfigurasi'),
                  ('tracks delivered', 'track disetor'),
                  ('✓ Tidak ada action penting yang tertunda.', '✓ Tidak ada tindakan penting yang tertunda.'),
              ],
              'app/main_window.py': [
                  ('Proyek file:', 'File proyek:'),
                  ('Sumber folder:', 'Folder sumber:'),
                  ('Start date:', 'Tanggal mulai:'),
                  ('Last sync:', 'Sinkron terakhir:'),
                  ("{settings.project_name or 'Proyek'} ready", "{settings.project_name or 'Proyek'} siap"),
                  ('Gunakan Needs Attention untuk langsung membuka workflow terkait.', 'Gunakan Perlu Perhatian untuk langsung membuka alur terkait.'),
                  ('Script search focused', 'Pencarian naskah difokuskan'),
              ],
              'pages/dialog_page.py': [
                  ('Source berubah sejak dialog ini terakhir direkam.', 'Sumber berubah sejak dialog ini terakhir direkam.'),
                  ('Source berubah sejak dialog terakhir direkam.', 'Sumber berubah sejak dialog terakhir direkam.'),
                  ('status recording', 'status rekaman'),
              ],
              'dialogs/source_refresh_preview_dialog.py': [
                  ('Parser/Resolver warnings:', 'Peringatan parser/resolver:'),
                  ('warning lainnya', 'peringatan lainnya'),
                  ('perubahan source', 'perubahan sumber'),
              ],
              'dialogs/new_project_dialog.py': [
                  ('Project Name wajib diisi.', 'Nama Proyek wajib diisi.'),
                  ('Lokasi penyimpanan project wajib dipilih.', 'Lokasi penyimpanan proyek wajib dipilih.'),
              ],
              'dialogs/project_settings_dialog.py': [
                  ('Source Folder berubah.', 'Folder Sumber berubah.'),
                  ('Episode Preview:', 'Pratinjau Episode:'),
                  ('Source Folder.', 'Folder Sumber.'),
              ],
              'dialogs/recent_projects_dialog.py': [
                  ('Pilih project terakhir', 'Pilih proyek terakhir'),
                  ('recent project', 'proyek terbaru'),
                  ('Create New', 'Buat Baru'),
              ],
              'pages/data_workspace_controller.py': [
                  ('DATA workspace belum terhubung ke project.', 'Workspace DATA belum terhubung ke proyek.'),
              ],
              'pages/data_page.py': [
                  ('Belum ada project yang dibuka.', 'Belum ada proyek yang dibuka.'),
                  ('needs review', 'perlu ditinjau'),
                  ('workflow warning', 'peringatan alur'),
                  ('Refresh Data', 'Muat Ulang Data'),
              ],
              'pages/data_alias_page.py': [
                  ('Needs Review', 'Perlu Ditinjau'),
                  ('Missing Character', 'Tokoh Belum Ada'),
                  ('unresolved character', 'tokoh belum dipetakan'),
              ],
              'pages/tracking_compact_page.py': [
                  ('Warnings:', 'Peringatan:'),
                  ('Expected File:', 'File Diharapkan:'),
                  ('expected filename', 'nama file yang diharapkan'),
                  ('Canonical character name', 'Nama tokoh kanonis'),
                  ('Double-click', 'Klik dua kali'),
              ],
              'dialogs/track_rename_preview_dialog.py': [
                  ('Expected filename', 'Nama file yang diharapkan'),
                  ('expected filename', 'nama file yang diharapkan'),
                  ('File Unmatched atau Ambiguous', 'File Tidak Cocok atau Ambigu'),
              ],
              'widgets/page_header.py': [],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              for old, new in pairs:
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Compile Python
        run: python -m compileall -q app pages dialogs widgets services
      - name: Remove temporary workflow
        run: rm -f .github/workflows/ui-language-visible-polish-temp.yml
      - name: Commit polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish remaining visible Indonesian terminology"
          git push origin HEAD:phase10-ui-language-audit
